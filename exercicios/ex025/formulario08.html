<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>Exemplo de Formulário</h1>

    <form action="cadastro.php" method="get">

        <P>
            <label for="1num">Número 1</label>
            <input type="number" name="n1" id="inum1" min="0" max="10" required oninput="isoma.innerHTML = Number (inum1.value) + Number (inum2.value)">
        </P>
        
        <p>
            <label for="2num">Número 2</label>
            <input type="number" name="n2" id="inum2" min="0" max="10" required oninput="isoma.innerHTML = Number (inum1.value) + Number (inum2.value)">
        </p>

        <p>
            <label for="isoma">Soma</label>
            <output id="isoma">
                0
            </output>
        </p>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
