<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form4</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="get">
        <p><label for="iemail">E-mail:</label>
        <input type="email" name="email" id="iemail" required>
        </p>

        <p>
            <label for="itel">Telefone: </label>
            <input type="tel" name="tel" id="itel" pattern="^\(\d{2}\)\d{4,5}-\d{4}$" required>
            
        </p>

        <p>
            <label for="icpf">Cpf: </label>
            <input type="cpf" name="cpf" id="icpf" pattern="^\d{3}\.\d{3}\.\d{3}-\d{2}$">
            
        </p>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">

    </form>
</body>
</html>
