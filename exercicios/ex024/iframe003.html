<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>uso de iframe</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        iframe{
            display: block;
            margin: auto;
            width: 300px;
            height: 500px;
            border: 2px solid black;
            border-radius: 20px;
            box-shadow: 10px 10px 10px;
        }
    </style>
</head>
<body>
    <h1>Teste Iframe</h1>
    <p>Páginas Testes</p>
    <ul>
        <li><a href="https://qi.edu.br/" target="frame">QI faculdade</a></li>
        <li><a href="https://www.cursoemvideo.com/" target="frame">cursoemvideo</a></li>
        <li><a href="https://www.facebook.com/?locale=pt_BR" target="frame"> Facebook</a></li>
    </ul>
    
    <h1>Páginas Selecionadas</h1>
    <iframe src="" frameborder="0" name="frame"></iframe>
</body>
</html>
