<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>menu-flex</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        *{
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
            user-select: none;
        }

        body{
            background-color: blueviolet;
        }

        header{
            background-color: brown;
            text-align: center;
        }

        #menu-lateral{
            background-color: white;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            transform: translateX(-100%);
            transition: transform 0s ease;
            z-index: 1000;
        }

        #menu-lateral.ativo{
            transform: translateX(0);
        }

        .topo-menu{
            background-color: darkgoldenrod;
            display: flex;
            justify-content: center;
            height: 60px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgb(85, 85, 85);
        }

        #fechar{
            background-color: cornflowerblue;
            width: 100vw;
            padding: 10px;
            font-size: 32px;
            cursor: pointer;
            text-align: center;
        }

        #burger{
            background-color: chartreuse;
            width: 100vw;
            text-align: center;
            cursor: pointer;
            font-size: 32px;
        }

        li{
            background-color: burlywood;
            display: flex;
            justify-content: center;
        }

        a{
            text-decoration: none;
            padding: 10px;
        }

        a:hover{
            background-color: chocolate;
            width: 110px;
            text-align: center;
        }

        @media (min-width: 768px) and (max-width: 1024px) {
    body {
        background-color: lightgray;
    }

    #unico{
        display: flex;
        align-items: center;
    }

    header{
        width: 100vw;
        order: 1;
        padding: 10px;
    }

    #burger{
            background-color: darkgreen;
            padding: 10px;
            width: 50px;
            text-align: center;
            cursor: pointer;
            font-size: 36px;
        }

    #menu-lateral{
            width: 260px;
            height: 100vh;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

}

@media (min-width: 1025px) {
    body {
        background-color: darkslategray;
    }

    #unico{
        display: flex;
        align-items: center;
    }

    header{
        width: 100vw;
        order: 1;
        padding: 10px;
    }

    #burger{
            background-color: darkgreen;
            padding: 10px;
            width: 50px;
            text-align: center;
            cursor: pointer;
            font-size: 36px;
        }

    #menu-lateral{
            width: 260px;
            height: 100vh;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

}
    </style>
</head>
<body>
    <div id="unico">
        <header>
            <h1>Menu flex</h1>
        </header>
        <span class="material-icons" id="burger">
          menu
        </span>
    </div>

    <nav id="menu-lateral">
        <div class="topo-menu">
            <span class="material-icons" id="fechar">
             menu
            </span>
        </div>
                <ul>
                    <li><a href="">Inicio</a></li>
                    <li><a href="">Sobre</a></li>
                    <li><a href="">Serviços</a></li>
                    <li><a href="">Contatos</a></li>
                    <li><a href="">Configuração</a></li>
                </ul>
    </nav>

    <script>
        const menu = document.getElementById('menu-lateral')
        const abrir = document.getElementById('burger')
        const fechar = document.getElementById('fechar')

        abrir.onclick =()=>{
            menu.classList.add('ativo')
        }

        fechar.onclick =()=>{
            menu.classList.remove('ativo')
        }

    </script>
    
</body>
</html>
