<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
        }

        body{
            height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            display: grid;
            grid-template: repeat(12,1fr) / repeat(12,1fr);
        }

        .cabecalho{
            background-color: red;
            grid-row: 1/3;
            grid-column: 1/13;
        }

        .menu{
            background-color: green;
            grid-row: 3/4;
            grid-column: 1/13;
        }

        .principal{
            background-color: yellow;
            grid-row: 4/10;
            grid-column: 1/9;
        }

        .subprincipal{
            background-color: violet;
            grid-row: 4/10;
            grid-column: 9/13;
        }

        .conteudo-extra{
            background-color: aqua;
            grid-row: 10/12;
            grid-column: 1/13;
        }

        .final{
            background-color: indigo;
            grid-row: 12/13;
            grid-column: 1/13;
        }

        p{
            height: 100%;
            font-size: 1.6em;

            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <header class="cabecalho">
        <p>Cabeçalho</p>
    </header>
    
    <nav class="menu"> <p>Menu</p>
        <div class="menu-bar-1"><p>Bar1</p></div>

        <div class="menu-bar-2"><p>Bar2</p></div>
    </nav>

    <main class="principal">
        <p>Principal</p>
    </main>

    <section class="subprincipal">
        <p>SubPrincipal</p>
    </section>

    <div class="conteudo-extra">
        <p>Extra</p>
    </div>

    <footer class="final">
        <p>Final</p>
    </footer>
</body>
</html>
