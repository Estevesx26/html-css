<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            font-family: Arial, Helvetica, sans-serif;
        }

        .container{
            display: grid;
            grid-template: repeat(10, 1fr) / repeat(5, 1fr);
            gap: 5px;

            background-color: black;
            width: 320px;
            height: 600px;
        }
        
        .text1{
            font-size: 1em;
            display: flex;
            justify-content:start ;
            grid-row: 1/2;
            grid-column: 1/7;
        }

        .text2{
            font-size: 1em;
            display: flex;
            justify-content:end ;
            grid-row: 1/2;
            grid-column: 1/7;
        }

        .especial{
            color: orangered;
            grid-row: 6/7;
            grid-column: 2/3;
        }

        .especial1{
            color: orangered;
            grid-row: 6/7;
            grid-column: 3/4;
        }

        .especial2{
            color: orangered;
            grid-row: 6/7;
            grid-column: 4/5;
        }

        .especial3{
            color: orangered;
            grid-row: 6/7;
            grid-column: 5/6;
        }

        .especial4{
            color: orangered;
            grid-row: 7/8;
            grid-column: 5/6;
        }

        .especial5{
            color: orangered;
            grid-row: 8/9;
            grid-column: 5/6;
        }

        .especial6{
            color: orangered;
            grid-row: 9/10;
            grid-column: 5/6;
        }

        .igual{
            background-color: orangered;
            font-size: 1.6em;
            grid-row: 10/11;
            grid-column: 4/6;
        }

        .num1{
            grid-row: 9/10;
            grid-column: 2/3;
        }

        .num2{
            grid-row: 9/10;
            grid-column: 3/4;
        }

        .num3{
            grid-row: 9/10;
            grid-column: 4/5;
        }

        .num4{
            grid-row: 8/9;
            grid-column: 2/3;
        }

        .num5{
            grid-row: 8/9;
            grid-column: 3/4;
        }

        .num6{
            grid-row: 8/9;
            grid-column: 4/5;
        }

        .num7{
            grid-row: 7/8;
            grid-column: 2/3;
        }

        .num8{
            grid-row: 7/8;
            grid-column: 3/4;
        }

        .num9{
            grid-row: 7/8;
            grid-column: 4/5;
        }

        .num0{
            grid-row: 10/11;
            grid-column: 2/4;
        }

        .zero{
            background-color: black;
            grid-row: 4/6;
            grid-column: 4/7;
            display: flex;
            justify-content: end;
            align-items: center;
            padding-right: 10px;
            font-size: 2.6em;
        }

        div{
            background-color: rgb(55, 55, 55);
            color: white;
            border-radius: 10px;
            height: 100%;
            font-size: 1.2em;

            display: flex;
            justify-content: center;
            align-items: center;
        }

    </style>
</head>
<body>
    <div class="container">
        <h2 class="text1">Calculadora</h2>
        <h2 class="text2">Conversor</h2>

        <div class="especial">AC</div>
        <div class="especial1">X</div>
        <div class="especial2">%</div>
        <div class="especial3">/</div>
        <div class="especial4">X</div>
        <div class="especial5">-</div>
        <div class="especial6">+</div>

        <div class="num1">1</div>
        <div class="num2">2</div>
        <div class="num3">3</div>
        <div class="num4">4</div>
        <div class="num5">5</div>
        <div class="num6">6</div>
        <div class="num7">7</div>
        <div class="num8">8</div>
        <div class="num9">9</div>
        <div class="num0">0</div>

        <div class="igual">=</div>
        <div class="zero">0</div>
    </div>
</body>
</html>
