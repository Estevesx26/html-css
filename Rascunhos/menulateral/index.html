<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        #menu-lateral{
            background-color: aqua;
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            transform: translateX(-100%);
            transition: transform 0.3s ease;
            z-index: 1000;
        }

        #menu-lateral.ativo{
            transform: translateX(0);
        }

        .topo-menu{
            height: 60px;
            display: flex;
            align-items: center;
            padding-left: 15px;
            border-bottom: 1px solid blue;
        }

        #fechar{
            font-size: 32px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    
    <span class="material-icons" id="burger">
menu
</span>

    <nav id="menu-lateral">
        <div class="topo-menu">
            <span class="material-icons" id="fechar">
            close
            </span>
        </div>
        <ul>
            <li>Curiosidades</li>
            <li>Objetivos</li>
            <li>Produção</li>
            <li>Seleçao</li>
            <li>Contato</li>
        </ul>
    </nav>

    <script>
        const menu = document.getElementById ('menu-lateral')
        const abrir = document.getElementById('burger')
        const fechar = document.getElementById('fechar')

        abrir.onclick=()=>{
            menu.classList.add('ativo')
        }

        fechar.onclick=()=>{
            menu.classList.remove('ativo')
        }
    </script>

</body>
</html>
